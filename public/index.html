<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanflix</title>
<style>
  :root {
    --bg: #0a0e12;
    --panel: #101820;
    --teal: #2dd4c8;
    --blue: #3b82f6;
    --accent-dim: #23566b;
    --text: #dceef0;
    --text-dim: #7d94a0;
    --rule: #1c2933;
    --gradient: linear-gradient(135deg, var(--teal), var(--blue));
    --gradient-glow: linear-gradient(135deg, #8b5cf6, #22d3ee, #3b82f6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 24px 5vw 18px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }

  .brand-block { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand::before {
    content: "▸ ";
    -webkit-text-fill-color: var(--teal);
  }

  .tagline {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  #search-input {
    background: var(--panel);
    border: 1px solid var(--rule);
    color: var(--text);
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 3px;
    width: 220px;
    outline: none;
  }

  #search-input:focus {
    border-color: var(--teal);
  }

  #upload-btn {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--teal);
    font-size: 13px;
    letter-spacing: 1px;
    padding: 9px 16px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
  }

  #upload-btn:hover {
    background: var(--gradient);
    color: #04181a;
    border-color: transparent;
  }

  /* Category chip row */
  #categories {
    padding: 16px 5vw 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip {
    background: var(--panel);
    border: 1px solid var(--rule);
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 6px 13px;
    border-radius: 20px;
    cursor: pointer;
  }

  .chip:hover {
    border-color: var(--accent-dim);
    color: var(--text);
  }

  .chip.active {
    background: var(--gradient);
    color: #04181a;
    border-color: transparent;
    font-weight: 600;
  }

  .chip-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .chip-add {
    background: var(--panel);
    border: 1px solid var(--rule);
    color: var(--text-dim);
    font-size: 12px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 1;
  }

  .chip-add:hover {
    border-color: #8b5cf6;
    color: #8b5cf6;
  }

  /* Assign-to-category banner */
  #assign-banner {
    display: none;
    margin: 14px 5vw 0;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(34,211,238,0.1));
    border: 1px solid #8b5cf6;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 13px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  #assign-banner.active {
    display: flex;
  }

  #assign-banner strong {
    background: var(--gradient-glow);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #assign-done {
    background: var(--gradient-glow);
    border: none;
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.5px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 3px;
    cursor: pointer;
  }

  main {
    padding: 20px 5vw 60px;
  }

  #status {
    color: var(--text-dim);
    font-size: 14px;
    padding: 40px 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
  }

  .card {
    background: linear-gradient(var(--panel), var(--panel)) padding-box,
                linear-gradient(135deg, var(--rule), var(--rule)) border-box;
    border: 2px solid transparent;
    border-radius: 16px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    position: relative;
  }

  .card:hover, .card:focus-visible, .card.gamepad-focus {
    background: linear-gradient(var(--panel), var(--panel)) padding-box,
                var(--gradient-glow) border-box;
    transform: translateY(-3px);
    box-shadow: 0 0 18px rgba(139, 92, 246, 0.35), 0 0 30px rgba(34, 211, 238, 0.2);
  }

  .card:focus-visible {
    outline: none;
  }

  .card.assign-member {
    background: linear-gradient(var(--panel), var(--panel)) padding-box,
                var(--gradient-glow) border-box;
    box-shadow: 0 0 14px rgba(139, 92, 246, 0.3);
  }

  .card-thumb {
    position: relative;
    aspect-ratio: 2 / 3;
    background:
      radial-gradient(circle at 30% 20%, rgba(139,92,246,0.25), transparent 55%),
      radial-gradient(circle at 75% 75%, rgba(34,211,238,0.2), transparent 55%),
      linear-gradient(160deg, #16202b, #0a1116 70%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-thumb .play-icon {
    font-size: 26px;
    color: rgba(220, 238, 240, 0.25);
  }

  .card-thumb-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 14px 12px 12px;
    background: linear-gradient(to top, rgba(5,8,10,0.95) 5%, rgba(5,8,10,0.55) 40%, transparent 75%);
  }

  .card-badge {
    align-self: flex-start;
    background: var(--gradient-glow);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
  }

  .card-thumb-title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    text-transform: capitalize;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(10, 14, 18, 0.7);
    border: 1px solid var(--rule);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .delete-btn:hover {
    background: #c0503f;
    border-color: #c0503f;
    color: #fff;
  }

  .assign-check {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--gradient-glow);
    color: #fff;
    font-size: 14px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .card.assign-member .assign-check {
    display: flex;
  }

  .card-body {
    padding: 10px 12px 12px;
  }

  .card-meta {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }

  .card-tags {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag-pill {
    font-size: 10px;
    color: var(--teal);
    background: rgba(45, 212, 200, 0.1);
    border: 1px solid var(--accent-dim);
    border-radius: 10px;
    padding: 2px 8px;
    letter-spacing: 0.3px;
  }

  .edit-tags-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
  }

  .edit-tags-btn:hover {
    color: var(--teal);
  }

  /* Full-page drag-and-drop indicator */
  #dropzone {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(10, 14, 18, 0.92);
    border: 3px dashed var(--teal);
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 22px;
    color: var(--teal);
    pointer-events: none;
  }

  #dropzone.active {
    display: flex;
  }

  /* Upload progress list */
  #uploads {
    margin: 0 0 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .upload-row {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 10px 14px;
    font-size: 13px;
  }

  .upload-row .name {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    color: var(--text-dim);
  }

  .upload-row .bar-track {
    height: 4px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }

  .upload-row .bar-fill {
    height: 100%;
    background: var(--gradient);
    width: 0%;
    transition: width 0.15s ease;
  }

  .upload-row.error .bar-fill {
    background: #c0503f;
  }

  .upload-row.error .name {
    color: #d98070;
  }

  /* Tag editor modal */
  #tag-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 30;
    align-items: center;
    justify-content: center;
  }

  #tag-modal-overlay.open {
    display: flex;
  }

  #tag-modal {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 22px;
    width: min(420px, 90vw);
  }

  #tag-modal h3 {
    margin: 0 0 4px;
    font-size: 16px;
    text-transform: capitalize;
    color: var(--text);
  }

  #tag-modal p {
    margin: 0 0 14px;
    font-size: 12px;
    color: var(--text-dim);
  }

  #tag-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--rule);
    color: var(--text);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 3px;
    outline: none;
    margin-bottom: 14px;
  }

  #tag-input:focus {
    border-color: var(--teal);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .modal-actions button {
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--text);
  }

  #tag-save {
    background: var(--gradient);
    border-color: transparent;
    color: #04181a;
    font-weight: 600;
  }

  /* Player overlay */
  #player-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 10;
    padding: 4vh 5vw;
    flex-direction: column;
  }

  #player-overlay.open {
    display: flex;
  }

  .player-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  #player-title {
    font-family: Georgia, serif;
    font-size: 18px;
    color: var(--teal);
    text-transform: capitalize;
  }

  #close-player {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--text);
    font-size: 13px;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
  }

  #close-player:hover {
    border-color: var(--teal);
    color: var(--teal);
  }

  video {
    width: 100%;
    max-height: 82vh;
    background: black;
    border-radius: 3px;
  }

  /* Music player: album-art circle + bar visualizer */
  #music-player {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex: 1;
    padding: 20px 0 10px;
  }

  #music-player.open {
    display: flex;
  }

  #music-art {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(139,92,246,0.5), transparent 60%),
                radial-gradient(circle at 65% 70%, rgba(34,211,238,0.4), transparent 60%),
                linear-gradient(160deg, #16202b, #0a1116 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.25), 0 0 60px rgba(34, 211, 238, 0.15);
    animation: pulse-art 2.4s ease-in-out infinite;
  }

  @keyframes pulse-art {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  #music-note {
    font-size: 54px;
    color: rgba(255,255,255,0.85);
  }

  #visualizer {
    width: 100%;
    max-width: 720px;
    height: 200px;
  }

  #audio-el {
    width: 100%;
    max-width: 480px;
  }

  /* Gamepad connection indicator */
  #gamepad-indicator {
    display: none;
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: var(--panel);
    border: 1px solid var(--teal);
    color: var(--teal);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 14px;
    border-radius: 20px;
    z-index: 5;
  }

  #gamepad-indicator.connected {
    display: block;
  }
</style>
</head>
<body>

<header>
  <div class="brand-block">
    <div class="brand">Lanflix</div>
    <div class="tagline">Local Network Streaming</div>
  </div>
  <div class="header-controls">
    <input type="text" id="search-input" placeholder="Search…">
    <input type="file" id="file-input" accept="video/mp4,.mp4,.webm,.mkv,.mov,.m4v,.mp3,.wav,.flac,.m4a,.ogg,.aac" multiple hidden>
    <button id="upload-btn">+ ADD VIDEO</button>
  </div>
</header>

<div id="categories"></div>

<div id="assign-banner">
  <span>Adding to <strong id="assign-category-name"></strong> — tap videos to toggle</span>
  <button id="assign-done">DONE</button>
</div>

<main>
  <div id="uploads"></div>
  <div id="status">Loading library…</div>
  <div class="grid" id="grid"></div>
</main>

<div id="dropzone">Drop video files anywhere to add them</div>

<div id="tag-modal-overlay">
  <div id="tag-modal">
    <h3 id="tag-modal-title"></h3>
    <p>Comma-separated categories. A video can belong to as many as you like.</p>
    <input type="text" id="tag-input" placeholder="e.g. comedy, 90s, favorites">
    <div class="modal-actions">
      <button id="tag-cancel">CANCEL</button>
      <button id="tag-save">SAVE</button>
    </div>
  </div>
</div>

<div id="player-overlay">
  <div class="player-top">
    <div id="player-title"></div>
    <button id="close-player">✕ CLOSE</button>
  </div>
  <video id="video-el" controls autoplay></video>

  <div id="music-player">
    <div id="music-art">
      <div id="music-note">♪</div>
    </div>
    <canvas id="visualizer"></canvas>
    <audio id="audio-el" controls autoplay></audio>
  </div>
</div>

<div id="gamepad-indicator">🎮 CONTROLLER CONNECTED — D-PAD TO NAVIGATE, A TO SELECT, B TO GO BACK</div>

<script src="app.js"></script>
</body>
</html>
